name: "🌐 Web Deploy"

on:
  workflow_run:
    workflows: ["🔢 Auto Version Bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # write is required to export the Buildx cache with type=gha
  actions: write

env:
  REGISTRY: ghcr.io
  # GHCR package owned by this repository. Dokploy pulls :latest.
  IMAGE_NAME: ${{ github.repository_owner }}/iacle-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            BRAND=iacle

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"
          echo "GHCR packages start private. This workflow cannot change package visibility."
          echo "Dokploy needs a ghcr.io registry credential with read:packages, unless an owner has already set this package public in GitHub package settings."

  deploy_dokploy:
    needs: build_and_push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: bash scripts/ci/trigger_dokploy_deploy.sh

      - name: Confirm iacle.app serves the app
        run: |
          set -euo pipefail
          for host in iacle.app www.iacle.app app.iacle.app; do
            ok=0
            for _ in $(seq 1 24); do
              code=$(curl -sS -o "/tmp/${host}.html" -w "%{http_code}" --max-time 30 "https://${host}/" || true)
              echo "${host} -> ${code}"
              if [ "$code" = "200" ] && ! grep -q "404 page not found" "/tmp/${host}.html" && grep -q "IACl" "/tmp/${host}.html"; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "https://${host}/ did not return the IAClé app"
              head -c 300 "/tmp/${host}.html" || true
              exit 1
            fi
          done

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "⚠️ CLOUDFLARE_CACHE_PURGE_TOKEN not set — skipping cache purge"
            exit 0
          fi
          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "⚠️ CF_ZONE_ID not set — skipping cache purge"
            exit 0
          fi
          echo "🧹 Purging Cloudflare cache for zone $CF_ZONE_ID..."
          PURGE_RESP=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' 2>&1)
          SUCCESS=$(echo "$PURGE_RESP" | jq -r '.success // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️ Cache purge response: $PURGE_RESP"
          fi
