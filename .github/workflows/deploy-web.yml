name: "🌐 Web Deploy"

# Entry point for the release/deploy chain (#681): push to main starts Web
# Deploy; desktop, mobile, and backend listen to this workflow via workflow_run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # write is required to export the Buildx cache with type=gha
  actions: write

env:
  REGISTRY: ghcr.io
  # GHCR package for this repository. Dokploy pulls :latest.
  IMAGE_NAME: iacle-solutions/iacle-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Stage brand licence
        env:
          IACLE_BRAND_LICENCE: ${{ secrets.IACLE_BRAND_LICENCE }}
        run: |
          set -euo pipefail
          if [ -z "${IACLE_BRAND_LICENCE:-}" ]; then
            echo "❌ IACLE_BRAND_LICENCE is not set"
            exit 66
          fi
          umask 077
          printf '%s' "$IACLE_BRAND_LICENCE" > "$RUNNER_TEMP/iacle.licence"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            BRAND=iacle
          secret-files: |
            brand_licence=${{ runner.temp }}/iacle.licence
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"

  # GitHub Actions asks Dokploy to pull the image. A missing webhook fails
  # the deploy. Nobody deploys this by hand.
  deploy_dokploy:
    needs: [build_and_push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: bash scripts/ci/trigger_dokploy_deploy.sh

  # Every deploy purges the whole zone after Dokploy is triggered, and the
  # deploy fails if the purge fails.
  purge_cache:
    needs: [deploy_dokploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      # Every deploy purges the whole zone, and the deploy fails if it cannot.
      - name: Purge Cloudflare cache (full zone)
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "❌ CLOUDFLARE_CACHE_PURGE_TOKEN and CF_ZONE_ID must both be set"
            exit 1
          fi
          RESP=$(curl -sS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$RESP" | jq -r '.success // false')" != "true" ]; then
            echo "❌ Cloudflare purge failed: $(echo "$RESP" | jq -c '.errors // "no error detail"')"
            exit 1
          fi
          echo "✅ Cloudflare cache purged (full zone)"
